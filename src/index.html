<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Augmented Reality Demo · School of Construction and Design · USM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23000%22/%3E%3Cpath d=%22M3 12V6l5-3 5 3v6z%22 fill=%22%23FFD046%22/%3E%3C/svg%3E">
  <style>
    /* Archivo, self-hosted exactly as in the USM career fair app */
    @font-face { font-family: "Display"; src: url("external/fonts/archivo-italic.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: italic; font-display: swap; }
    @font-face { font-family: "Display"; src: url("external/fonts/archivo-roman.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap; }
    @font-face { font-family: "Body"; src: url("external/fonts/archivo-roman.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("external/fonts/archivo-roman.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  </style>

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="ui">
    <header class="masthead">
      <div class="masthead__brand" id="brand" role="img" aria-label="The University of Southern Mississippi"></div>
      <div class="masthead__copy">
        <div class="masthead__eyebrow">School of Construction and Design</div>
        <div class="masthead__sub">University of Southern Mississippi</div>
        <div class="masthead__title">Augmented Reality Demo</div>
      </div>
      <div id="status" class="status">Loading model…</div>
    </header>

    <div class="float-row">
      <section id="hud" class="card hud" aria-live="polite">
        <div class="hud__top">
          <div>
            <div class="eyebrow">4D construction schedule</div>
            <div id="hud-date" class="hud__date">—</div>
            <div id="hud-meta" class="hud__meta"></div>
          </div>
          <div class="hud__pct"><span id="hud-pct">0</span><small>%</small><em>of model built</em></div>
        </div>
        <div class="bar"><span id="hud-bar"></span></div>
        <ul id="hud-tasks" class="hud__tasks"></ul>
        <div class="legend">
          <span><i class="lg done"></i>Built</span>
          <span><i class="lg active"></i>In progress</span>
          <span><i class="lg planned"></i>Not started</span>
        </div>
      </section>

      <section id="info" class="card info hidden" aria-live="polite">
        <button id="info-close" class="icon-btn" aria-label="Close">✕</button>
        <div id="info-body"></div>
      </section>
    </div>

    <section id="sheet">
      <div id="panel" class="panel">
        <div class="sheet-head">
          <div class="seg" role="tablist">
            <button data-tab="plan" aria-selected="true">2D plan</button>
            <button data-tab="schedule" aria-selected="false">Schedule</button>
          </div>
          <button id="ao-toggle" class="ao-btn" aria-pressed="true" title="Baked ambient occlusion">AO on</button>
          <button id="panel-toggle" class="icon-btn" aria-label="Collapse panel">▾</button>
        </div>
        <div id="tab-plan" class="tab">
          <div id="level-tabs" class="chips" role="tablist"></div>
          <div id="plan" class="plan"></div>
        </div>
        <div id="tab-schedule" class="tab hidden">
          <div id="gantt" class="gantt"></div>
        </div>
      </div>

      <div class="timeline">
        <button id="play" class="play" aria-label="Play the 4D simulation">▶</button>
        <div class="tl-body">
          <div class="tl-labels"><span id="tl-start"></span><span id="tl-date" class="tl-date"></span><span id="tl-end"></span></div>
          <div class="tl-track">
            <div id="tl-ticks" class="tl-ticks"></div>
            <input id="slider" type="range" min="0" max="100" step="0.25" value="100" aria-label="Schedule date">
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="scene-root"></div>
  <script src="bundle.js"></script>
</body>

</html>
